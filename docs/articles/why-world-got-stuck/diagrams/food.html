<figure class="figure" id="fig-food" aria-labelledby="food-title">
  <p class="figure-kicker">Figure 2 · schematic, not measured data</p>
  <h3 id="food-title">More spending power, a finite appetite</h3>
  <div class="legend">
    <span><i class="swatch old" aria-hidden="true"></i>Old: food demand keeps rising</span
    ><span><i class="swatch" aria-hidden="true"></i>Revised: food quantity levels off</span>
  </div>
  <svg
    viewBox="0 0 370 255"
    role="img"
    aria-labelledby="food-chart-title food-chart-desc"
    style="max-width: 460px; margin: auto"
  >
    <title id="food-chart-title">Food demand before and after the ceiling</title>
    <desc id="food-chart-desc">
      A schematic old line rises with purchasing power. The revised line rises and then stops at one and a
      half subsistence baskets. No time series or exact demand curve is implied.
    </desc>
    <text class="soft" x="45" y="18">Food quantity wanted</text>
    <path class="edge" d="M45 35V210H350" />
    <path class="rule" d="M45 123H350" fill="none" stroke-dasharray="3 5" />
    <text class="soft" x="32" y="129" text-anchor="end">1.5</text>
    <text class="soft" x="32" y="216" text-anchor="end">0</text>
    <path class="rust" d="M45 210L333 43" fill="none" stroke-width="2.5" stroke-dasharray="6 5" />
    <path class="blue" d="M45 210L195 123H350" fill="none" stroke-width="3" />
    <text class="blue-text" x="241" y="149">Food ceiling</text>
    <text class="soft" x="45" y="242">Lower</text>
    <text class="soft" x="195" y="242" text-anchor="middle">Spending power →</text>
    <text class="soft" x="350" y="242" text-anchor="end">Higher</text>
  </svg>
  <figcaption>
    Beyond the food ceiling, extra spending shifts toward other goods. The lines illustrate the rule, not an
    exact demand function. Actual purchases still depend on affordability and supply.
  </figcaption>
</figure>
