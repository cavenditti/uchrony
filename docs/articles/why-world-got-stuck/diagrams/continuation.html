<figure class="figure" id="fig-continuation" aria-labelledby="continuation-title">
  <p class="figure-kicker">Figure 11 · checking the same future</p>
  <h3 id="continuation-title">Does saving change what happens next?</h3>
  <div class="save-fork">
    <div class="node">One world state</div>
    <div class="cols">
      <div class="lane">

        <div class="arrow" aria-hidden="true">↘</div>
